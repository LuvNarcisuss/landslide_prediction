          - code [ref=e170]: CLAUDE.md
          - text: ，这些信息只需写一次，Claude 每次都会遵守。
        - paragraph [ref=e171]:
          - text: 具体来说，
          - code [ref=e172]: CLAUDE.md
          - text: 可以帮你做到以下几件事：
