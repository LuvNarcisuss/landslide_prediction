        - heading "文件内容结构" [level=2] [ref=e244]
        - paragraph [ref=e245]:
          - code [ref=e246]: CLAUDE.md
          - text: 是一个普通的 Markdown 文件，没有强制的格式要求，但良好的结构能帮助 Claude 更快找到关键信息。以下是推荐的内容结构：
        - generic [ref=e247]: "# 项目名称 一句话说明这个项目是什么，方便 Claude 快速定位项目性质。 ## 技术栈 - 语言：Python 3.11 - 框架：FastAPI 0.110 - 数据库：PostgreSQL 15 + SQLAlchemy ORM - 测试：pytest ## 常用命令 ### 开发 ```bash uv run uvicorn main:app --reload # 启动开发服务器 uv run pytest # 运行所有测试 uv run pytest -k \"test_auth\" # 运行指定测试 ``` ### 代码检查 ```bash uv run ruff check . # 代码检查 uv run ruff format . # 代码格式化 ``` ## 项目结构 - `src/api/` — API 路由和请求处理 - `src/models/` — 数据库模型定义 - `src/services/` — 业务逻辑层 - `tests/` — 测试文件，与 src/ 目录结构镜像对应 ## 编码规范 - 使用 `uv` 管理依赖，不使用 pip 直接安装 - 所有函数必须有类型注解 - 字符串一律使用双引号 - 新增 API 路由必须同步添加测试 ## 注意事项 - 不要修改 `migrations/` 目录下的已有文件，只能新增迁移文件 - `config/secrets.py` 包含敏感配置，禁止输出其内容到日志或终端 - 数据库操作必须通过 Service 层，不要在路由层直接操作 ORM "
        - separator [ref=e248]
        - heading "核心内容模块详解" [level=2] [ref=e249]
        - heading "1、常用命令" [level=3] [ref=e250]
        - paragraph [ref=e251]:
          - text: 这是
          - code [ref=e252]: CLAUDE.md
          - text: 中
          - strong [ref=e253]: 最高频被参考
          - text: 的部分。Claude 在执行测试、构建、代码检查等任务时，会优先查找这里定义的命令，避免猜测或使用错误的命令：
        - generic [ref=e254]: "## 常用命令 ### 安装依赖 ```bash npm ci # 安装依赖（CI 环境使用，严格按 lock 文件安装） ``` ### 开发 ```bash npm run dev # 启动开发服务器（端口 3000） npm run build # 构建生产版本 npm run preview # 预览生产构建 ``` ### 测试 ```bash npm test # 运行所有测试 npm test -- --watch # 监听模式 npm test -- --coverage # 生成覆盖率报告 ``` ### 代码质量 ```bash npm run lint # ESLint 检查 npm run lint:fix # 自动修复可修复的问题 npm run typecheck # TypeScript 类型检查 ``` "
        - heading "2、项目结构说明" [level=3] [ref=e255]
        - paragraph [ref=e256]: 帮助 Claude 快速定位文件，减少不必要的目录扫描，尤其在大型项目中效果明显：
        - generic [ref=e257]: "## 项目结构 ``` src/ ├── app/ # Next.js App Router 页面 │ ├── (auth)/ # 需要登录才能访问的页面组 │ └── api/ # API 路由 ├── components/ # 可复用 UI 组件 │ ├── ui/ # 基础 UI 组件（Button、Input 等） │ └── features/ # 业务组件（按功能模块组织） ├── lib/ # 工具函数和配置 │ ├── db/ # 数据库客户端和查询 │ └── auth/ # 认证相关逻辑 └── types/ # TypeScript 类型定义 ``` 关键文件： - `src/lib/db/client.ts` — 数据库连接配置 - `src/middleware.ts` — 认证中间件，处理路由保护 - `env.example` — 所有必要的环境变量示例 "
        - heading "3、编码规范" [level=3] [ref=e258]
        - paragraph [ref=e259]: 告知 Claude 项目的代码风格和约定，确保生成的代码与现有代码库风格一致：
        - generic [ref=e260]: "## 编码规范 ### 通用 - 文件名使用 kebab-case（如 `user-profile.ts`），类名使用 PascalCase - 优先使用具名导出（named export），避免默认导出（default export） - 异步函数一律使用 async/await，禁止使用 .then() 链式调用 ### 组件规范 - 组件文件与其测试文件放在同一目录（如 `Button.tsx` 和 `Button.test.tsx`） - Props 类型使用 interface 定义，命名格式为 `${组件名}Props` - 不要将业务逻辑写在组件中，提取为自定义 Hook 或 Service ### 错误处理 - API 路由使用统一的错误响应格式：`{ error: string, code: string }` - 客户端错误通过 Error Boundary 捕获，不要在每个组件里单独 try/catch "
        - heading "4、架构约束与禁止事项" [level=3] [ref=e261]
        - paragraph [ref=e262]: 这是防止 Claude 犯"聪明但错误"决策的关键部分。对于你了解但 Claude 不知道的特殊情况，必须明确写出来：
        - generic [ref=e263]: "## 架构约束 - 所有数据库查询必须通过 `src/lib/db/queries/` 中的函数执行，不要在路由或组件中直接写 SQL - 状态管理使用 Zustand，不要引入 Redux 或其他状态管理库 - 样式使用 Tailwind CSS utility class，不要新增 CSS 文件或使用 CSS Modules ## 注意事项（重要） - `legacy/` 目录下的代码是遗留代码，**禁止修改**，只能读取 - `.env.local` 和 `.env.production` 包含真实密钥，**禁止输出文件内容** - `prisma/migrations/` 中已有的迁移文件**禁止修改**，数据库变更只能新增迁移 - 修改 `src/middleware.ts` 前必须先告知我，该文件影响所有路由的认证逻辑 "
        - heading "5、开发环境说明" [level=3] [ref=e264]
        - paragraph [ref=e265]: 帮助 Claude 理解项目的运行环境，避免因环境差异导致命令执行失败：
        - generic [ref=e266]: "## 开发环境 - Node.js：需要 v20 或以上版本（通过 `.nvmrc` 指定） - 包管理器：pnpm（禁止使用 npm 或 yarn 安装依赖） - 本地数据库：Docker Compose 启动（`docker compose up -d`） - 端口：前端 3000，API 3001，数据库 5432 ### 环境变量 参考 `.env.example` 文件配置本地环境变量，复制为 `.env.local` 后填入实际值。 必填项：`DATABASE_URL`、`NEXTAUTH_SECRET`、`NEXTAUTH_URL` "
